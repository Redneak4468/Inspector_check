{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title text-center mb-3">Вход в систему</h4>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Неверный логин или пароль
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        {{ form.username.label_tag }}
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        {{ form.password.label_tag }}
                        {{ form.password }}
                    </div>

                    <button class="btn btn-primary w-100" type="submit">
                        Войти
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
